<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="1050" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="1050" height="620" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Title block -->
  <line x1="220" y1="0" x2="220" y2="90" stroke="#333"/>
  <line x1="0" y1="90" x2="1050" y2="90" stroke="#333"/>
  <text x="10" y="18" font-size="11" font-weight="bold">PLC SYSTEM OVERVIEW</text>
  <text x="10" y="32" font-size="11" font-weight="bold">RUNG DIAGRAM</text>
  <text x="10" y="50" font-size="9">PROJECT: AUTOMATED CONTROL SYSTEM</text>
  <text x="10" y="63" font-size="9">REVISION: 1.0   DATE: [EXPORT DATE]</text>
  <text x="10" y="76" font-size="8" fill="#888">NOTES: [placeholder text in source image]</text>
  <text x="10" y="86" font-size="8" fill="#888">NOTE: XXXX XXXXLXXX XXX.</text>
  <text x="520" y="30" text-anchor="middle" font-size="16" font-weight="bold">PLC LADDER LOGIC DIAGRAM: RUNG OVERVIEW</text>

  <!-- Rung rows -->
  <g stroke="#333" stroke-width="1">
    <line x1="0" y1="180" x2="1050" y2="180"/>
    <line x1="0" y1="300" x2="1050" y2="300"/>
    <line x1="0" y1="390" x2="1050" y2="390"/>
    <line x1="0" y1="460" x2="1050" y2="460"/>
    <line x1="0" y1="530" x2="1050" y2="530"/>
    <line x1="220" y1="90" x2="220" y2="530"/>
  </g>

  <g font-size="11" font-weight="bold">
    <text x="15" y="105">0001</text>
    <text x="15" y="235">0002</text>
    <text x="15" y="320">0003</text>
    <text x="15" y="400">0004</text>
    <text x="15" y="470">0005</text>
  </g>

  <!-- rung power rails -->
  <line x1="250" y1="95" x2="250" y2="525" stroke="#333" stroke-width="2"/>
  <line x1="1010" y1="95" x2="1010" y2="525" stroke="#333" stroke-width="2"/>

  <!-- Rung 1: IR / NO -> TP1 timer -> STOP -> LED -->
  <g font-size="11">
    <line x1="250" y1="115" x2="1010" y2="115" stroke="#333"/>
    <text x="270" y="108">IR</text>
    <rect x="280" y="105" width="20" height="18" fill="none" stroke="#333"/>
    <text x="330" y="108">NO</text>
    <rect x="340" y="105" width="20" height="18" fill="none" stroke="#333"/>
    <rect x="420" y="90" width="100" height="45" fill="none" stroke="#333"/>
    <text x="470" y="102" text-anchor="middle" font-size="9" font-weight="bold">TP1</text>
    <text x="428" y="115" font-size="9">TP</text>
    <text x="428" y="128" font-size="9">IN</text>
    <text x="505" y="115" font-size="9">Q</text>
    <text x="425" y="140" font-size="8" fill="#888">t810s-</text>
    <text x="425" y="150" font-size="8" fill="#888">PT: 10s</text>
    <text x="425" y="160" font-size="8" fill="#888">ET: -abc-</text>
    <text x="580" y="108">STOP</text>
    <line x1="620" y1="105" x2="640" y2="123" stroke="#333"/>
    <line x1="620" y1="123" x2="640" y2="105" stroke="#333"/>
    <text x="270" y="150">EN</text>
    <rect x="280" y="147" width="20" height="18" fill="none" stroke="#333"/>
  </g>
  <text x="1030" y="108" text-anchor="middle" font-size="11">LED</text>
  <circle cx="1010" cy="115" r="7" fill="none" stroke="#333"/>

  <!-- Rung 2: TEMP / IR NC -> TO1 -> TP2 -> STOP -> FAN -->
  <g font-size="11">
    <line x1="250" y1="225" x2="1010" y2="225" stroke="#333"/>
    <text x="255" y="218">TEMP</text>
    <text x="270" y="255">IR</text>
    <rect x="280" y="205" width="20" height="18" fill="none" stroke="#333"/>
    <text x="330" y="218">TEMP</text>
    <rect x="340" y="205" width="20" height="18" fill="none" stroke="#333"/>
    <rect x="400" y="190" width="90" height="45" fill="none" stroke="#333"/>
    <text x="445" y="202" text-anchor="middle" font-size="9" font-weight="bold">TO1</text>
    <text x="405" y="215" font-size="9">TON</text>
    <text x="405" y="228" font-size="9">IN</text>
    <text x="470" y="215" font-size="9">Q</text>
    <text x="330" y="248" font-size="8" fill="#888">tt5s-</text>
    <text x="405" y="245" font-size="8" fill="#888">PT: 5s</text>
    <text x="405" y="255" font-size="8" fill="#888">ET: -lmn-</text>
    <rect x="510" y="190" width="90" height="45" fill="none" stroke="#333"/>
    <text x="555" y="202" text-anchor="middle" font-size="9" font-weight="bold">TP2</text>
    <text x="515" y="215" font-size="9">TP  IN</text>
    <text x="580" y="215" font-size="9">Q</text>
    <text x="515" y="245" font-size="8" fill="#888">tt10s-</text>
    <text x="515" y="255" font-size="8" fill="#888">PT: 10s</text>
    <text x="515" y="265" font-size="8" fill="#888">ET: -xyz-</text>
    <text x="640" y="218">STOP</text>
    <line x1="680" y1="205" x2="700" y2="223" stroke="#333"/>
    <line x1="680" y1="223" x2="700" y2="205" stroke="#333"/>
    <text x="620" y="248" font-size="9" fill="#888">-xyz-</text>
    <line x1="250" y1="255" x2="340" y2="255" stroke="#333"/>
    <text x="270" y="248">EN</text>
    <rect x="280" y="245" width="20" height="18" fill="none" stroke="#333"/>
    <text x="345" y="248">NC</text>
    <rect x="355" y="245" width="20" height="18" fill="none" stroke="#333"/>
  </g>
  <text x="1030" y="218" text-anchor="middle" font-size="11">FAN</text>
  <circle cx="1010" cy="225" r="7" fill="none" stroke="#333"/>

  <!-- Rung 3: ALARM -> TO2 -> LIGHT -->
  <g font-size="11">
    <line x1="250" y1="315" x2="1010" y2="315" stroke="#333"/>
    <text x="255" y="308">ALARM</text>
    <rect x="290" y="305" width="20" height="18" fill="none" stroke="#333"/>
    <rect x="400" y="290" width="90" height="45" fill="none" stroke="#333"/>
    <text x="445" y="302" text-anchor="middle" font-size="9" font-weight="bold">TO2</text>
    <text x="405" y="315" font-size="9">TON  IN</text>
    <text x="470" y="315" font-size="9">Q</text>
    <text x="405" y="345" font-size="8" fill="#888">tt5s-  PT: 5s</text>
    <text x="405" y="355" font-size="8" fill="#888">ET: -lmn-</text>
    <rect x="530" y="305" width="20" height="18" fill="none" stroke="#333"/>
  </g>
  <text x="1030" y="308" text-anchor="middle" font-size="11">LIGHT</text>
  <circle cx="1010" cy="315" r="7" fill="none" stroke="#333"/>

  <!-- Rung 4: LIGHT -> STOO -->
  <g font-size="11">
    <line x1="250" y1="380" x2="1010" y2="380" stroke="#333"/>
    <text x="255" y="373">LIGHT</text>
    <rect x="300" y="370" width="20" height="18" fill="none" stroke="#333"/>
  </g>
  <text x="1030" y="373" text-anchor="middle" font-size="11">STOO</text>
  <circle cx="1010" cy="380" r="7" fill="none" stroke="#333"/>

  <!-- Rung 5: S1 / STOP -> EN -->
  <g font-size="11">
    <line x1="250" y1="450" x2="1010" y2="450" stroke="#333"/>
    <text x="270" y="443">S1</text>
    <rect x="280" y="440" width="20" height="18" fill="none" stroke="#333"/>
    <text x="330" y="443">STOP</text>
    <line x1="360" y1="440" x2="380" y2="458" stroke="#333"/>
    <line x1="360" y1="458" x2="380" y2="440" stroke="#333"/>
  </g>
  <text x="1030" y="443" text-anchor="middle" font-size="11">EN</text>
  <circle cx="1010" cy="450" r="7" fill="none" stroke="#333"/>

  <text x="900" y="600" font-size="10" fill="#888">PLC SYSTEM DIAGRAM</text>
  <text x="525" y="610" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">
    PLACEHOLDER — template rung layout with placeholder tag/timer text (-abc-, -lmn-, -xyz-), not the team's real ladder logic.
  </text>
</svg>
