<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="1150" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Wiring / Interconnection Diagram</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <g font-size="12" fill="#666" font-weight="bold">
    <text x="20" y="200">SENSING</text>
    <text x="20" y="430">INTERFACE</text>
    <text x="20" y="700">ACTUATION</text>
    <text x="20" y="980">POWER</text>
  </g>

  <!-- SENSING -->
  <rect x="90" y="120" width="230" height="90" rx="10" fill="#c99a5b" stroke="#7a5323"/>
  <text x="205" y="150" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">PIR sensor</text>
  <text x="205" y="170" text-anchor="middle" fill="#fff" font-size="12">HC-SR501</text>
  <text x="205" y="190" text-anchor="middle" fill="#fff" font-size="11">VCC · GND · OUT</text>

  <rect x="90" y="270" width="230" height="70" rx="10" fill="#c99a5b" stroke="#7a5323"/>
  <text x="205" y="310" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">DHT22 sensor</text>

  <rect x="430" y="100" width="260" height="180" rx="10" fill="#1f5c8a" stroke="#123a58"/>
  <text x="560" y="130" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">ESP32</text>
  <text x="560" y="150" text-anchor="middle" fill="#dbeeff" font-size="11">3.3 V logic</text>
  <text x="560" y="172" text-anchor="middle" fill="#dbeeff" font-size="11">GPIO14 ← PIR OUT</text>
  <text x="560" y="192" text-anchor="middle" fill="#dbeeff" font-size="11">GPIO15 ← DHT DATA</text>
  <text x="560" y="212" text-anchor="middle" fill="#dbeeff" font-size="11">GPIO O1, O2 →</text>
  <text x="560" y="234" text-anchor="middle" fill="#dbeeff" font-size="11">GND (shared)</text>

  <g stroke-width="2">
    <line x1="320" y1="140" x2="430" y2="140" stroke="#e0a53f" marker-end="url(#a1)"/>
    <text x="345" y="132" font-size="10" fill="#a06e15">5 V</text>
    <line x1="320" y1="160" x2="430" y2="160" stroke="#aaa"/>
    <text x="345" y="153" font-size="10" fill="#888">GND</text>
    <line x1="320" y1="180" x2="430" y2="180" stroke="#2f8f6b" marker-end="url(#a1)"/>
    <text x="345" y="173" font-size="10" fill="#1f6b4d">OUT</text>

    <line x1="320" y1="290" x2="430" y2="200" stroke="#e0a53f" marker-end="url(#a1)"/>
    <line x1="320" y1="310" x2="430" y2="220" stroke="#2f8f6b" marker-end="url(#a1)"/>
    <text x="345" y="285" font-size="10" fill="#1f6b4d">DATA</text>
  </g>

  <!-- INTERFACE -->
  <rect x="700" y="380" width="270" height="150" rx="10" fill="#5b3fa8" stroke="#3a2670"/>
  <text x="835" y="410" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Bosch Rexroth PLC</text>
  <text x="835" y="430" text-anchor="middle" fill="#e5dcff" font-size="11">Input module</text>
  <text x="835" y="452" text-anchor="middle" fill="#e5dcff" font-size="11">I1 ← Occupancy (O1)</text>
  <text x="835" y="472" text-anchor="middle" fill="#e5dcff" font-size="11">I2 ← Temperature (O2)</text>
  <text x="835" y="492" text-anchor="middle" fill="#e5dcff" font-size="11">COM ← ESP32 GND</text>

  <rect x="700" y="560" width="270" height="90" rx="10" fill="#5b3fa8" stroke="#3a2670"/>
  <text x="835" y="590" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">PLC output module</text>
  <text x="835" y="610" text-anchor="middle" fill="#e5dcff" font-size="11">Q1 → Lighting relay</text>
  <text x="835" y="630" text-anchor="middle" fill="#e5dcff" font-size="11">Q2 → Fan relay</text>
  <line x1="835" y1="530" x2="835" y2="560" stroke="#5b3fa8" stroke-width="2" marker-end="url(#a1)"/>

  <g stroke-width="2" stroke="#5b3fa8">
    <path d="M620 250 C 660 300, 660 380, 700 420" fill="none" marker-end="url(#a1)"/>
    <text x="640" y="360" font-size="10" fill="#3a2670">O1 → I1</text>
    <path d="M620 260 C 670 320, 670 400, 700 450" fill="none" marker-end="url(#a1)"/>
    <text x="640" y="400" font-size="10" fill="#3a2670">O2 → I2</text>
  </g>
  <line x1="560" y1="280" x2="835" y2="380" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="700" y="350" font-size="10" fill="#999">GND shared</text>

  <!-- ACTUATION -->
  <rect x="90" y="680" width="230" height="90" rx="10" fill="#1f7a5c" stroke="#123f30"/>
  <text x="205" y="710" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Lighting relay</text>
  <text x="205" y="730" text-anchor="middle" fill="#dfffee" font-size="11">Signal ← Q1</text>
  <text x="205" y="748" text-anchor="middle" fill="#dfffee" font-size="11">NO · COM contacts</text>

  <rect x="430" y="680" width="230" height="90" rx="10" fill="#c99a5b" stroke="#7a5323"/>
  <text x="545" y="710" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">LED / light</text>
  <text x="545" y="730" text-anchor="middle" fill="#fff2de" font-size="11">AC / DC supply</text>
  <text x="545" y="748" text-anchor="middle" fill="#fff2de" font-size="11">via NO–COM loop</text>

  <rect x="90" y="820" width="230" height="90" rx="10" fill="#1f7a5c" stroke="#123f30"/>
  <text x="205" y="850" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Fan relay</text>
  <text x="205" y="870" text-anchor="middle" fill="#dfffee" font-size="11">Signal ← Q2</text>
  <text x="205" y="888" text-anchor="middle" fill="#dfffee" font-size="11">NO · COM contacts</text>

  <rect x="430" y="820" width="230" height="90" rx="10" fill="#c99a5b" stroke="#7a5323"/>
  <text x="545" y="850" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">DC motor (fan)</text>
  <text x="545" y="870" text-anchor="middle" fill="#fff2de" font-size="11">9 V / 12 V supply</text>
  <text x="545" y="888" text-anchor="middle" fill="#fff2de" font-size="11">via NO–COM loop</text>

  <g stroke="#e0a53f" stroke-width="2">
    <line x1="320" y1="725" x2="430" y2="725" marker-end="url(#a1)"/>
    <line x1="430" y1="740" x2="320" y2="740" marker-end="url(#a1)"/>
    <text x="345" y="718" font-size="10" fill="#a06e15">NO–COM</text>
    <line x1="320" y1="865" x2="430" y2="865" marker-end="url(#a1)"/>
    <line x1="430" y1="880" x2="320" y2="880" marker-end="url(#a1)"/>
    <text x="345" y="858" font-size="10" fill="#a06e15">NO–COM</text>
  </g>
  <line x1="700" y1="650" x2="205" y2="680" stroke="#1f7a5c" stroke-width="2" fill="none"/>
  <line x1="700" y1="650" x2="205" y2="820" stroke="#1f7a5c" stroke-width="2" fill="none"/>

  <!-- POWER -->
  <rect x="90" y="990" width="220" height="90" rx="10" fill="#8a2a2a" stroke="#5a1a1a"/>
  <text x="200" y="1025" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Main DC supply</text>
  <text x="200" y="1045" text-anchor="middle" fill="#ffe0e0" font-size="11">12 V–24 V in</text>

  <rect x="380" y="990" width="220" height="90" rx="10" fill="#8a4a2a" stroke="#5a2f1a"/>
  <text x="490" y="1020" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Buck converter</text>
  <text x="490" y="1040" text-anchor="middle" fill="#ffe8d8" font-size="11">Steps to 3.3 V / 5 V</text>
  <text x="490" y="1058" text-anchor="middle" fill="#ffe8d8" font-size="11">powers ESP32</text>

  <rect x="670" y="990" width="220" height="90" rx="10" fill="#8a4a2a" stroke="#5a2f1a"/>
  <text x="780" y="1020" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Relay VCC rail</text>
  <text x="780" y="1040" text-anchor="middle" fill="#ffe8d8" font-size="11">5 V or 24 V</text>
  <text x="780" y="1058" text-anchor="middle" fill="#ffe8d8" font-size="11">separate from ESP32</text>

  <g stroke-dasharray="5 4" stroke-width="2" fill="none">
    <path d="M310 1035 L 380 1035" stroke="#e0a53f" marker-end="url(#a1)"/>
    <path d="M490 990 L 490 280" stroke="#8a2a2a" marker-end="url(#a1)"/>
    <path d="M200 990 L 200 130" stroke="#e0a53f" marker-end="url(#a1)"/>
    <path d="M200 1080 L 200 1110 L 780 1110 L 780 1080" stroke="#8a2a2a"/>
    <path d="M205 910 L 205 1080" stroke="#8a2a2a" marker-end="url(#a1)"/>
  </g>

  <!-- Legend -->
  <g font-size="12">
    <line x1="90" y1="1110" x2="130" y2="1110" stroke="#2f8f6b" stroke-width="3"/>
    <text x="140" y="1114">Signal / data</text>
    <line x1="260" y1="1110" x2="300" y2="1110" stroke="#e0a53f" stroke-width="3"/>
    <text x="310" y="1114">VCC power</text>
    <line x1="420" y1="1110" x2="460" y2="1110" stroke="#aaa" stroke-width="3"/>
    <text x="470" y="1114">GND</text>
    <line x1="540" y1="1110" x2="580" y2="1110" stroke="#8a2a2a" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="590" y="1114">Power bus (dashed)</text>
  </g>
  <text x="500" y="1140" text-anchor="middle" font-size="11" fill="#999">Recreated by Claude from a chat-pasted image — not an original export. Replace with the team's real diagram when available.</text>
</svg>
