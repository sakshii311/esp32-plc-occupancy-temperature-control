<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Arial, Helvetica, sans-serif">
  <rect width="980" height="760" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">System Block Diagram — Occupancy &amp; Temperature Control</text>

  <!-- Row labels -->
  <g font-size="12" fill="#666" font-weight="bold">
    <text x="20" y="95">Sensing</text>
    <text x="20" y="205">Processing</text>
    <text x="20" y="315">Control</text>
    <text x="20" y="425">Ladder logic</text>
    <text x="20" y="535">Actuation</text>
    <text x="20" y="645">Output</text>
  </g>
  <g stroke="#e5e5e5" stroke-dasharray="2 4">
    <line x1="0" y1="130" x2="980" y2="130"/>
    <line x1="0" y1="240" x2="980" y2="240"/>
    <line x1="0" y1="350" x2="980" y2="350"/>
    <line x1="0" y1="460" x2="980" y2="460"/>
    <line x1="0" y1="570" x2="980" y2="570"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Sensing row -->
  <g font-size="13">
    <rect x="90" y="55" width="160" height="60" rx="8" fill="#f8b4b4" stroke="#c74a4a"/>
    <text x="170" y="80" text-anchor="middle" font-weight="bold">IR sensor (HC-SR501)</text>
    <text x="170" y="98" text-anchor="middle" font-size="11">Presence detection</text>

    <rect x="280" y="55" width="160" height="60" rx="8" fill="#f8b4b4" stroke="#c74a4a"/>
    <text x="360" y="80" text-anchor="middle" font-weight="bold">DHT22 sensor</text>
    <text x="360" y="98" text-anchor="middle" font-size="11">Temperature monitoring</text>

    <rect x="470" y="55" width="160" height="60" rx="8" fill="#7fd3c9" stroke="#2f8f81"/>
    <text x="550" y="80" text-anchor="middle" font-weight="bold">Alarm sensor</text>
    <text x="550" y="98" text-anchor="middle" font-size="11">Alarm trigger input</text>

    <rect x="770" y="45" width="90" height="30" rx="6" fill="#d9d9d9" stroke="#999"/>
    <text x="815" y="65" text-anchor="middle" font-size="11">Power supply</text>
    <rect x="770" y="85" width="90" height="30" rx="6" fill="#d9d9d9" stroke="#999"/>
    <text x="815" y="105" text-anchor="middle" font-size="11">Buck / LDO</text>
    <line x1="815" y1="75" x2="815" y2="85" stroke="#666" marker-end="url(#arrow)"/>
  </g>

  <!-- Processing row -->
  <rect x="90" y="165" width="740" height="60" rx="8" fill="#f5b878" stroke="#b8722a"/>
  <text x="460" y="190" text-anchor="middle" font-size="13" font-weight="bold">ESP32 microcontroller</text>
  <text x="460" y="208" text-anchor="middle" font-size="11">Reads sensors; outputs O1, O2 to PLC inputs I1, I2</text>

  <g stroke="#555" font-size="11">
    <line x1="170" y1="115" x2="200" y2="165" marker-end="url(#arrow)"/>
    <text x="150" y="140">O1</text>
    <line x1="360" y1="115" x2="380" y2="165" marker-end="url(#arrow)"/>
    <text x="340" y="140">O2</text>
    <line x1="550" y1="115" x2="640" y2="165" marker-end="url(#arrow)"/>
    <text x="610" y="140">ALARM</text>
    <line x1="815" y1="115" x2="700" y2="165" marker-end="url(#arrow)"/>
    <text x="740" y="140">3.3V/5V</text>
  </g>

  <!-- Control row -->
  <rect x="90" y="275" width="360" height="60" rx="8" fill="#c3cc7a" stroke="#7d8a2e"/>
  <text x="270" y="300" text-anchor="middle" font-size="13" font-weight="bold">Bosch Rexroth PLC</text>
  <text x="270" y="318" text-anchor="middle" font-size="11">Occupancy &amp; temperature control logic</text>

  <rect x="500" y="275" width="230" height="60" rx="8" fill="#c3cc7a" stroke="#7d8a2e"/>
  <text x="615" y="300" text-anchor="middle" font-size="13" font-weight="bold">PLC alarm input</text>
  <text x="615" y="318" text-anchor="middle" font-size="11">ALARM signal (I3)</text>

  <g stroke="#555" font-size="11">
    <line x1="270" y1="225" x2="270" y2="275" marker-end="url(#arrow)"/>
    <text x="230" y="255">I1</text>
    <line x1="380" y1="225" x2="360" y2="275" marker-end="url(#arrow)"/>
    <text x="340" y="255">I2</text>
    <line x1="650" y1="225" x2="615" y2="275" marker-end="url(#arrow)"/>
  </g>

  <!-- Ladder logic row -->
  <rect x="90" y="385" width="640" height="60" rx="8" fill="#c3cc7a" stroke="#7d8a2e"/>
  <text x="410" y="408" text-anchor="middle" font-size="13" font-weight="bold">Ladder logic program</text>
  <text x="410" y="426" text-anchor="middle" font-size="11">5 rungs: I1 → Q1 (LED), I2 → Q2 (FAN), ALARM → TO2 → LIGHT, latch &amp; enable</text>
  <line x1="270" y1="335" x2="270" y2="385" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="615" y1="335" x2="615" y2="385" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Actuation row -->
  <g font-size="13">
    <rect x="90" y="495" width="170" height="60" rx="8" fill="#8fb3e8" stroke="#2f5fa8"/>
    <text x="175" y="518" text-anchor="middle" font-weight="bold">Lighting relay</text>
    <text x="175" y="536" text-anchor="middle" font-size="11">Energises on Q1</text>

    <rect x="290" y="495" width="170" height="60" rx="8" fill="#8fb3e8" stroke="#2f5fa8"/>
    <text x="375" y="518" text-anchor="middle" font-weight="bold">Fan relay</text>
    <text x="375" y="536" text-anchor="middle" font-size="11">Energises on Q2</text>

    <rect x="490" y="495" width="200" height="60" rx="8" fill="#7fd3c9" stroke="#2f8f81"/>
    <text x="590" y="518" text-anchor="middle" font-weight="bold">Alarm light relay</text>
    <text x="590" y="536" text-anchor="middle" font-size="11">Energises on LIGHT out</text>
  </g>
  <g stroke="#555" font-size="11">
    <line x1="200" y1="445" x2="175" y2="495" marker-end="url(#arrow)"/>
    <text x="185" y="470">Q1</text>
    <line x1="330" y1="445" x2="375" y2="495" marker-end="url(#arrow)"/>
    <text x="330" y="470">Q2</text>
    <line x1="500" y1="445" x2="590" y2="495" marker-end="url(#arrow)"/>
    <text x="500" y="470">LIGHT</text>
  </g>

  <!-- Output row -->
  <g font-size="13">
    <rect x="90" y="605" width="170" height="60" rx="8" fill="#c9a8e0" stroke="#7a4ea8"/>
    <text x="175" y="628" text-anchor="middle" font-weight="bold">LED / light bulb</text>
    <text x="175" y="646" text-anchor="middle" font-size="11">Lighting load</text>

    <rect x="290" y="605" width="170" height="60" rx="8" fill="#c9a8e0" stroke="#7a4ea8"/>
    <text x="375" y="628" text-anchor="middle" font-weight="bold">DC motor (fan)</text>
    <text x="375" y="646" text-anchor="middle" font-size="11">Cooling load</text>

    <rect x="490" y="605" width="200" height="60" rx="8" fill="#7fd3c9" stroke="#2f8f81"/>
    <text x="590" y="628" text-anchor="middle" font-weight="bold">Alarm indicator light</text>
    <text x="590" y="646" text-anchor="middle" font-size="11">Visual alarm output</text>
  </g>
  <g stroke="#555">
    <line x1="175" y1="555" x2="175" y2="605" marker-end="url(#arrow)"/>
    <line x1="375" y1="555" x2="375" y2="605" marker-end="url(#arrow)"/>
    <line x1="590" y1="555" x2="590" y2="605" marker-end="url(#arrow)"/>
  </g>

  <!-- Legend -->
  <g font-size="12">
    <rect x="90" y="700" width="16" height="16" fill="#f8b4b4" stroke="#c74a4a"/>
    <text x="112" y="713">Sensors / outputs</text>
    <rect x="250" y="700" width="16" height="16" fill="#f5b878" stroke="#b8722a"/>
    <text x="272" y="713">Processing</text>
    <rect x="380" y="700" width="16" height="16" fill="#c3cc7a" stroke="#7d8a2e"/>
    <text x="402" y="713">PLC / ladder</text>
    <rect x="520" y="700" width="16" height="16" fill="#8fb3e8" stroke="#2f5fa8"/>
    <text x="542" y="713">Actuation</text>
    <rect x="650" y="700" width="16" height="16" fill="#c9a8e0" stroke="#7a4ea8"/>
    <text x="672" y="713">Output loads</text>
    <rect x="780" y="700" width="16" height="16" fill="#7fd3c9" stroke="#2f8f81"/>
    <text x="802" y="713">Alarm path</text>
  </g>
  <text x="490" y="745" text-anchor="middle" font-size="11" fill="#999">Recreated by Claude from a chat-pasted image — not an original export. Replace with the team's real diagram when available.</text>
</svg>
